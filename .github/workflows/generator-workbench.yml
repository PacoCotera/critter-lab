name: Generator workbench checks

on:
  push:
    branches: [main]
    paths:
      - 'prototype/generator-workbench/**'
      - 'prototype/genetics/**'
      - 'prototype/tests/generator-workbench.test.mjs'
      - 'prototype/tests/pip-genetics.test.mjs'
      - '.github/workflows/generator-workbench.yml'
  pull_request:
    paths:
      - 'prototype/generator-workbench/**'
      - 'prototype/genetics/**'
      - 'prototype/tests/generator-workbench.test.mjs'
      - 'prototype/tests/pip-genetics.test.mjs'
      - '.github/workflows/generator-workbench.yml'

permissions:
  contents: read

jobs:
  host-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check host genetic and generator boundaries
        working-directory: prototype/generator-workbench
        run: node --test authoring.test.mjs family.test.mjs pet.test.mjs ../tests/generator-workbench.test.mjs ../tests/pip-genetics.test.mjs
      - name: Install pinned authoring dependencies
        working-directory: prototype/generator-workbench
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the framework workbench
        working-directory: prototype/generator-workbench
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm run build
