name: Native target builds

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-build.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-build.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and check native loop
        run: |
          cmake -S native/lab -B native/build/lab -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRITTER_BUILD_SELECTED_LAB=ON
          cmake --build native/build/lab
          node --test native/selected-lab/bridge.test.mjs
          ctest --test-dir native/build/lab -R "selected_lab_native_checks|game_domain_checks|three_device_kit_checks" --output-on-failure
          native/build/lab/selected-lab/selected_lab frame native/build/lab/selected-lab.bmp
          git rev-parse HEAD > native/build/lab/source-revision.log
          sha256sum native/build/lab/selected-lab/selected_lab native/build/lab/selected-lab.bmp > native/build/lab/selected-lab-sha256.log
          native/build/lab/critter_lab --save "$RUNNER_TEMP/critter-demo-state" status | tee native/build/lab/run.log
          cc -std=c17 -Wall -Wextra -Wpedantic -Werror -I native/shared native/tests/test_pixels.c native/shared/demo_domain.c native/shared/demo_pixels.c native/shared/native_font.c native/shared/portable_font_data.c -o native/build/lab/test_pixels
          native/build/lab/test_pixels
          python3 native/tests/test_native.py "$PWD/native/build/lab/critter_lab"
          python3 native/tests/test_selected_presenter.py "$PWD/native/build/lab/selected-lab/selected_lab"
          python3 native/tests/test_v1_journey.py "$PWD/native/build/lab/selected-lab/selected_lab" native/build/lab/journey
          python3 native/tests/test_updater.py
          python3 native/tests/test_delivery.py
          size native/build/lab/critter_lab | tee native/build/lab/size.log
          cc --version > native/build/lab/compiler.log
      - name: Package tested Lab staging bundle
        run: |
          python3 native/tests/test_package_staging.py
          python3 native/package_staging.py create \
            --binary native/build/lab/selected-lab/selected_lab \
            --output "native/build/lab/critter-lab-staging-${GITHUB_SHA}.tar.gz"
          python3 native/package_staging.py verify \
            "native/build/lab/critter-lab-staging-${GITHUB_SHA}.tar.gz" \
            --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lab-${{ github.sha }}
          path: |
            native/build/lab/critter_lab
            native/build/lab/selected-lab/selected_lab
            native/build/lab/selected-lab.bmp
            native/build/lab/*.map
            native/build/lab/*.log
            native/build/lab/critter-lab-staging-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Probe toolchain
        run: |
          source native/toolchains.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.12-venv python3.12-dev gperf device-tree-compiler ninja-build cmake xz-utils
          python3.12 -m venv "$RUNNER_TEMP/zephyr-venv"
          source "$RUNNER_TEMP/zephyr-venv/bin/activate"
          pip install "west==$WEST_VERSION"
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_TAG" "$RUNNER_TEMP/zephyr-workspace"
          cd "$RUNNER_TEMP/zephyr-workspace"
          test "$(git -C zephyr rev-parse HEAD)" = "$ZEPHYR_REVISION"
          west update hal_nordic cmsis cmsis_6
          west zephyr-export
          pip install -r zephyr/scripts/requirements-base.txt
          west sdk install --version "$ZEPHYR_SDK_VERSION" --gnu-toolchains arm-zephyr-eabi --no-hosttools
      - name: Compile nRF52840 firmware
        run: |
          source native/toolchains.env
          source "$RUNNER_TEMP/zephyr-venv/bin/activate"
          export ZEPHYR_BASE="$RUNNER_TEMP/zephyr-workspace/zephyr"
          export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-$ZEPHYR_SDK_VERSION"
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          west build -b "$PROBE_BOARD" native/probe -d native/build/probe
          "$ZEPHYR_SDK_INSTALL_DIR/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-size" native/build/probe/zephyr/zephyr.elf | tee native/build/probe/size.log
          pip freeze > native/build/probe/python-packages.log
          for file in zephyr.elf zephyr.bin zephyr.map zephyr.dts .config; do
            test -s "native/build/probe/zephyr/$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-probe-${{ github.sha }}
          path: |
            native/build/probe/zephyr/zephyr.elf
            native/build/probe/zephyr/zephyr.bin
            native/build/probe/zephyr/zephyr.map
            native/build/probe/zephyr/zephyr.dts
            native/build/probe/zephyr/.config
            native/build/probe/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Companion toolchain
        run: |
          source native/toolchains.env
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.12-venv python3.12-dev cmake ninja-build libffi-dev libssl-dev dfu-util
          git clone --branch "$IDF_TAG" --depth 1 --recursive --shallow-submodules https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          test "$(git -C "$RUNNER_TEMP/esp-idf" rev-parse HEAD)" = "$IDF_REVISION"
          python3.12 "$RUNNER_TEMP/esp-idf/tools/idf_tools.py" install --targets="$COMPANION_TARGET"
          python3.12 "$RUNNER_TEMP/esp-idf/tools/idf_tools.py" install-python-env
      - name: Compile ESP32-S3 firmware
        run: |
          source native/toolchains.env
          source "$RUNNER_TEMP/esp-idf/export.sh"
          idf.py -C native/companion -B "$GITHUB_WORKSPACE/native/build/companion" set-target "$COMPANION_TARGET"
          idf.py -C native/companion -B "$GITHUB_WORKSPACE/native/build/companion" build
          idf.py -C native/companion -B "$GITHUB_WORKSPACE/native/build/companion" size | tee native/build/companion/size.log
          pip freeze > native/build/companion/python-packages.log
          for file in critter_companion.elf critter_companion.bin critter_companion.map bootloader/bootloader.bin partition_table/partition-table.bin flasher_args.json; do
            test -s "native/build/companion/$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-companion-${{ github.sha }}
          path: |
            native/build/companion/critter_companion.elf
            native/build/companion/critter_companion.bin
            native/build/companion/critter_companion.map
            native/build/companion/bootloader/bootloader.bin
            native/build/companion/partition_table/partition-table.bin
            native/build/companion/flasher_args.json
            native/build/companion/*.log
            native/companion/sdkconfig
          if-no-files-found: error
          retention-days: 14

  publish-staging:
    needs: [lab, probe, companion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'PacoCotera/critter-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: staging-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the tested bundle after all target checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]; then
            echo 'A newer main revision exists; skip stale publication.'
            exit 0
          fi
          tag="staging-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.'
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing reuse.'
            exit 1
          fi
          delivery_dir="$RUNNER_TEMP/staging-delivery"
          mkdir "$delivery_dir"
          gh run download "$GITHUB_RUN_ID" --name "native-lab-$GITHUB_SHA" --dir "$delivery_dir"
          bundle="$delivery_dir/critter-lab-staging-$GITHUB_SHA.tar.gz"
          python3 native/package_staging.py verify "$bundle" --commit "$GITHUB_SHA"
          export CRITTER_DELIVERY_BUNDLE="$bundle"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          bundle = Path(os.environ['CRITTER_DELIVERY_BUNDLE'])
          metadata = {
              'schema': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
              'sha': os.environ['GITHUB_SHA'], 'workflow': '.github/workflows/native-build.yml',
              'run_id': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'bundle': bundle.name, 'bundle_sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(),
              'save_format': 'CRITTER_DEMO 1',
          }
          (bundle.parent / 'delivery.json').write_text(json.dumps(metadata, sort_keys=True) + '\n')
          PY
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Staging $GITHUB_SHA" --notes 'Tested native staging bundle; publication is not activation.'
          gh release upload "$tag" "$bundle" "$delivery_dir/delivery.json"
          if [ "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced; retain unpublished draft for inspection.'
            exit 0
          fi
          if [ "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo 'Tag source mismatch; refusing publication.'
            exit 1
          fi
          gh release edit "$tag" --draft=false
